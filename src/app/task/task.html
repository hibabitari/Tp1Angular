<!-- 1. Interpolation : TS -> vue -->
<h2>{{ title }}</h2>
<p>Nombre de tâches : {{ tasks.length }}</p>

<!-- 2. Property binding : TS -> vue / 3. Event binding : vue -> TS -->
<input
  type="text"
  [placeholder]="placeholderText"
  [value]="newTask"
  (input)="onInput($event)"
  (keyup.enter)="addTask()"
/>

<button [disabled]="newTask.trim() === ''" (click)="addTask()">
  Ajouter
</button>

<ul>
  @for (task of tasks; track task.id) {
    <li>
      {{ task.name }}
      <button (click)="rename($index)">Renommer</button>
      <button [disabled]="!canDelete" (click)="deleteTask($index)">
        Supprimer
      </button>
    </li>
  } @empty {
    <p>Aucune tâche pour le moment. Profitez de votre journée !</p>
  }
</ul>
